[package]
name = "sdroxide-nrsc5"
version.workspace = true
edition.workspace = true
# The vendored C this wraps — `vendor/nrsc5` (GPL-3.0-or-later) — decodes
# HD Radio (NRSC-5). Its audio codec needs faad2's HDC variant, which
# `crates/sdroxide-faad2` builds from upstream faad2 with nrsc5's own
# `support/faad2-hdc-support.patch` applied — the one faad2 the binary has,
# shared with the DRM receiver, since two copies would collide on every
# `NeAACDec*` symbol.
license.workspace = true

# Native-only: links vendored C. Must never be a dependency of any
# wasm-targeted crate.

[dependencies]
sdroxide-faad2.workspace = true
sdroxide-types.workspace = true
sdroxide-dsp.workspace = true
num-complex.workspace = true
rtrb.workspace = true
tracing.workspace = true

[dev-dependencies]
# For the capture example only: it drives the decoder, and the warnings that
# path emits are part of what it reports.
tracing-subscriber.workspace = true

[build-dependencies]
cc = "1"